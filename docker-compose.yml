version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_commerce_db
    environment:
      POSTGRES_USER: commerce_user
      POSTGRES_PASSWORD: commerce_password
      POSTGRES_DB: agentic_commerce
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_user -d agentic_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data: