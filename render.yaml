services:
  - type: web
    name: aegiscommerce-api
    runtime: go
    plan: free
    buildCommand: go build -o api ./cmd/server && go build -o api-migrate ./cmd/migrate
    startCommand: ./api-migrate && ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegiscommerce-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: aegiscommerce-dashboard
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: BACKEND_URL
        # Free Render web services can send, but cannot receive, private-network
        # traffic. Use the API's public URL until the API is upgraded to a paid
        # web/private service.
        value: https://aegiscommerce-api.onrender.com/mcp/v1
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: aegiscommerce-db
    plan: free
