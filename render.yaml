services:
  - type: web
    name: aegiscommerce-api
    runtime: go
    plan: free
    buildCommand: go build -o api ./cmd/server && go build -o api-migrate ./cmd/migrate
    startCommand: ./api-migrate && ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegiscommerce-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: aegiscommerce-dashboard
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: http://aegiscommerce-api:10000/mcp/v1
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: aegiscommerce-db
    plan: free
