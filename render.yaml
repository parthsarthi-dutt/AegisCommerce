services:
  # ============================================
  # Go API / Trust Layer Backend
  # ============================================
  - type: web
    name: aegiscommerce-api
    runtime: go
    plan: free

    buildCommand: |
      go build -o api ./cmd/server
      go build -o api-migrate ./cmd/migrate

    startCommand: ./api-migrate && ./api

    healthCheckPath: /health

    envVars:
      # PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: aegiscommerce-db
          property: connectionString

      # Redis / Render Key Value
      - key: REDIS_URL
        fromService:
          name: aegiscommerce-redis
          type: keyvalue
          property: connectionString

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false


  # ============================================
  # Next.js Dashboard / AI Revenue Agent
  # ============================================
  - type: web
    name: aegiscommerce-dashboard
    runtime: node
    plan: free

    rootDir: frontend

    buildCommand: npm ci --include=dev && npm run build

    startCommand: npm run start

    envVars:
      # Backend MCP URL
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://aegiscommerce-api.onrender.com/mcp/v1

      # Server-side backend URL
      - key: BACKEND_URL
        value: https://aegiscommerce-api.onrender.com/mcp/v1

      # Groq
      - key: GROQ_API_KEY
        sync: false


  # ============================================
  # Redis-compatible Key Value
  # ============================================
  - type: keyvalue
    name: aegiscommerce-redis
    plan: free

    # Empty = no public internet access.
    # Your Go API can still access it internally.
    ipAllowList: []

    maxmemoryPolicy: allkeys-lru


# ============================================
# PostgreSQL
# ============================================
databases:
  - name: aegiscommerce-db
    plan: free